name: NOIRAX Watchdog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check heartbeat freshness
        id: heartbeat
        run: |
          if [ -f pipeline/status.json ]; then
            LAST_RUN=$(python3 -c "import json; print(json.load(open('pipeline/status.json'))['last_run'])")
            NOW=$(date -u +"%Y-%m-%dT%H:%M:%S")
            echo "Last heartbeat: $LAST_RUN"
            echo "Current time:    $NOW"
            LAST_EPOCH=$(date -d "$LAST_RUN" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            DIFF=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
            echo "Minutes since last heartbeat: $DIFF"
            echo "minutes_since=$DIFF" >> $GITHUB_OUTPUT
            if [ $DIFF -gt 70 ]; then
              echo "HEARTBEAT_STALE=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "status.json not found"
            echo "HEARTBEAT_STALE=true" >> $GITHUB_OUTPUT
            echo "minutes_since=999" >> $GITHUB_OUTPUT
          fi

      - name: Report status
        run: |
          echo "=== NOIRAX Watchdog Report ==="
          echo "Heartbeat minutes since: ${{ steps.heartbeat.outputs.minutes_since || 'unknown' }}"
          echo "Heartbeat stale: ${{ steps.heartbeat.outputs.HEARTBEAT_STALE || 'false' }}"
          echo "Check details at: https://noirax-plum.vercel.app/status"
          echo "Pipeline runs:  https://github.com/noiramaster/noirax/actions"
          if [ "${{ steps.heartbeat.outputs.HEARTBEAT_STALE }}" == "true" ]; then
            echo "WARNING: Heartbeat stale! Pipeline may be down."
          else
            echo "OK: Pipeline running normally."
          fi
